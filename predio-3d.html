<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torre de vidro — animação 3D</title>
<style>
  html,body{margin:0;height:100%;background:#9aa1a8;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity 1.2s ease}

  /* vinheta suave para dar aspecto fotográfico */

  #ui button{font:600 13px/1 inherit;padding:10px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.35);
    background:rgba(20,24,28,.45);color:#fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer}
  #ui button:hover{background:rgba(20,24,28,.65)}
  #ui button:disabled{opacity:.8;cursor:default}
  #ui.recording #btn-rec{background:rgba(190,30,30,.75)}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="vignette"></div>
<div id="ui">
  <button id="btn-pause">❚❚ Pausar</button>
  <button id="btn-rec">● Gravar loop em vídeo</button>
</div>
